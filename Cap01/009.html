<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>

  <script>
    // Aritmética
    let valA = 12 + 45;
    let valB = 55 - 89;
    let valC = 7 * 8;
    let valD = 21 / 3;
    let valE = 5 ** 3;  // 5 al cubo
    let valF = 5671 % 2; // Determina el residuo

    // Mostrar resultados de forma moderna y sencilla
    document.getElementById("salida").innerHTML =
      valA + "<br>" +
      valB + "<br>" +
      valC + "<br>" +
      valD + "<br>" +
      valE + "<br>" +
      valF + "<br>";
  </script>
</body></html>
