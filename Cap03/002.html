<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
    // Ciclo for decreciente
    let salida = "";

    for (let cont = 100; cont >= 1; cont--) {
      salida += cont + ", ";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
