<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
    //Ciclo for creciente de 3 en 3
    let salida = "";

	for (let cont = 0; cont <= 300; cont += 3) {
      salida += cont + ", ";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
