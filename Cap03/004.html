<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
	//Ciclo for creciente de 10 en 10. Se detiene antes de 500
    let salida = "";

	for (let cont = 0; cont < 500; cont += 10) {
      salida += cont + ", ";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
