<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
	//Ciclo for creciente aumentando el doble del anterior
    let salida = "";

	for (let cont = 1; cont <= 5000; cont *= 2) {
      salida += cont + ", ";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
