<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
	//Ciclo for decreciente disminuyendo la mitad del anterior
    let salida = "";

	for (let cont = 4096; cont >= 1; cont /= 2) {
      salida += cont + ", ";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
