<!DOCTYPE html><html lang="es"><body>
  <p id="salida"></p>
  <script>
	 /* Ciclo for con dos variables. Observar las dos
       condiciones que deben darse */
    let salida = "";

	 for (let x = 1, y = 34; x <= 10 && y >= 28; x++, y--) {
      salida += x + ", " + y + "<br>";
    }

    document.getElementById("salida").innerHTML = salida;
  </script>
</body></html>
