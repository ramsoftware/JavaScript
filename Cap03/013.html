<!DOCTYPE html><html lang="es"><body>
<p id="salida"></p>
<script>
//Ciclo while creciente aumentando el doble del anterior
let salida = "";

let cont = 1;
while (cont <= 5000) {
	salida += cont + ", ";
    cont *= 2;
}

document.getElementById("salida").innerHTML = salida;
//Resultado:1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096
</script>
</body></html>
