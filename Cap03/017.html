<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
/* Ciclo do-while con dos variables. Observemos las dos
   condiciones que deben darse cambiando && por || */
let x = 1;
let y = 34;
let salida = "";
do {
	salida += x + ", " + y + "<br>";	
	x++;
	y--;
} while (x <= 10 || y >= 28);
document.getElementById("salida").innerHTML = salida;
/* Resultado:
1, 34
2, 33
3, 32
4, 31
5, 30
6, 29
7, 28
8, 27
9, 26
10, 25
*/
</script></body></html>
