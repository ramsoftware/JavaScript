<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
//Ciclo do-while creciente de 10 en 10. Se detiene antes de 500
let cont = 0;
let salida = "";
do {
	salida += cont + ", ";		
	cont += 10;
} while (cont < 500);
document.getElementById("salida").innerHTML = salida;
</script></body></html>
