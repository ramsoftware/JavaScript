<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
//Ciclo while creciente. Sale cuando cont sea 50
let cont = 1;
let salida = "";
while (cont <= 100) {
	salida += cont + ", ";
	cont++;
	if (cont >= 50) break; //Sale del ciclo
}
document.getElementById("salida").innerHTML = salida;
</script></body></html>
