<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
//Ciclo while creciente. Se salta los pares
let cont = 1;
let salida = "";
while (cont <= 100) {
	cont++;
	if (cont % 2 === 0) continue; //Salta a la siguiente iteración
	salida += cont + ", ";
}
document.getElementById("salida").innerHTML = salida;
</script></body></html>
