<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
/* Variable aleatoria
   Distribución uniforme. Generar un número entero entre A y B
   variable = r * (B - A) + A	 */
let A = 10;
let B = 50;
let salida = "";
for (let cont = 1; cont <= 100; cont++) {
	let r = Math.random();
	let variable = r * (B - A) + A;
	salida += variable + ", ";
}
document.getElementById("salida").innerHTML = salida;
</script></body></html>
