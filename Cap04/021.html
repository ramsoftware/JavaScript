<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
//Convertir a binario
ConvierteBinario(70);

function ConvierteBinario(numero) {
	if (numero !== 0) {
		ConvierteBinario(Math.floor(numero / 2));
		document.getElementById("salida").innerHTML += numero % 2;
	}
}
</script></body></html>
