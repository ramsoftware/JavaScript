<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
document.getElementById("salida").innerHTML = "Imprimirá en 3 segundos:";

function Imprime() {
	document.getElementById("salida").innerHTML += "<br>Esta es una prueba";
}
</script></body></html>
