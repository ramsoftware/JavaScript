<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
/* Extraer una letra de una cadena. Las cadenas se comportan como arreglos unidimensionales, el primer elemento está en la posición 0 */
let cadena = "Esta es una prueba";
let letra = cadena[0]; //Trae la primera letra
document.getElementById("salida").innerHTML = letra;
</script></body></html>
