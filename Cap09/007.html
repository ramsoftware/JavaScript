<!DOCTYPE HTML><html lang="es"><head></head><body>
<p id="salida"></p>
<script>
//Segundo ejemplo de uso de JSON
let dato = {
	"mensaje": function () {
		document.getElementById("salida").innerHTML = "Hola Mundo";
	}
}
dato.mensaje();

/* Imprime:
	Hola Mundo
*/
</script></body></html>
