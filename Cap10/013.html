
<!DOCTYPE HTML>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
    div {
        width: 130px;
        height: 130px;
        margin: 20px;
        background-color: lightgreen;
    }
</style>
</head>
<body>

<div id="caja1"></div>

<script>
    function divMouseMueve() {
        document.bgColor = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }

    document.getElementById("caja1").addEventListener("mousemove", divMouseMueve);
</script>

</body>
</html>
