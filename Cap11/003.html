
<!DOCTYPE HTML>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
    #caja {
        width: 200px;
        height: 200px;
        background-color: lightgreen;
    }
</style>
</head>
<body>

<div id="caja"></div>

<input type="button" id="btnApagar" value="Apagar">
<input type="button" id="btnEncender" value="Encender">

<script>
    function apagar() {
        document.getElementById("caja").style.visibility = "hidden";
    }

    function encender() {
        document.getElementById("caja").style.visibility = "visible";
    }

    document.getElementById("btnApagar").addEventListener("click", apagar);
    document.getElementById("btnEncender").addEventListener("click", encender);
</script>

</body>
</html>
