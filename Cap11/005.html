<!DOCTYPE HTML>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  input {
    background-color: lightgreen;
    border: 1px solid gray;
  }
  input.enfoca {
    background-color: lightblue;
    border: 3px solid green;
  }
</style>
</head>
<body>

<input type="text" id="DatoA">
<input type="text" id="DatoB">

<script>
  function ponerEnfoca(e) {
    e.target.classList.add('enfoca');
  }
  function quitarEnfoca(e) {
    e.target.classList.remove('enfoca');
  }

  document.getElementById('DatoA').addEventListener('focus', ponerEnfoca);
  document.getElementById('DatoA').addEventListener('blur', quitarEnfoca);

  document.getElementById('DatoB').addEventListener('focus', ponerEnfoca);
  document.getElementById('DatoB').addEventListener('blur', quitarEnfoca);
</script>

</body>
</html>
